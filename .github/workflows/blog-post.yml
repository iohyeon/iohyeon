name: 최근 블로그 글 갱신
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/update_blog_posts.py
      - name: 바뀐 경우에만 커밋
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "HYEON"
          git config user.email "iohyeonsz@gmail.com"
          git commit -am "docs: 최근 블로그 글 목록 갱신"
          git push
