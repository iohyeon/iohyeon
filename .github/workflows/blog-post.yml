name: 최근 블로그 글 갱신
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://develop-tracking.tistory.com/rss"
          max_post_count: 5
          commit_message: "docs: 최근 블로그 글 목록 갱신"
          committer_username: "HYEON"
          committer_email: "iohyeonsz@gmail.com"
